name: Pre-production Checks

on:
  push:
    branches: [pre-production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Run Android Lint
        run: ./gradlew lintDebug

  unit-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test

  instrumented-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedAndroidTest

  create-release-pr:
    needs: [lint, unit-test, instrumented-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Create PR to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip when pre-production has advanced past the commit that passed the checks.
          # The run triggered by the newer push is responsible for creating the PR.
          LATEST_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/pre-production" --jq '.object.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "pre-production moved from $GITHUB_SHA to $LATEST_SHA. Skipping PR creation for the stale run."
            exit 0
          fi

          TITLE="Release v${{ steps.version.outputs.version-name }}"
          BODY="Automated release PR. All pre-production checks (lint, unit tests, instrumented tests) passed for commit ${GITHUB_SHA} (version ${{ steps.version.outputs.version-name }}, versionCode ${{ steps.version.outputs.version-code }})."
          EXISTING=$(gh pr list --base production --head pre-production --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base production \
              --head pre-production \
              --title "$TITLE" \
              --body "$BODY"
          else
            echo "An open PR to production already exists (#$EXISTING). Refreshing its title and body."
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          fi
