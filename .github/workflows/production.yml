name: Production Release

on:
  push:
    branches: [production]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An existing tag keeps its commit, so reusing a version for another commit would mislabel the APK.
          TAG="v${{ steps.version.outputs.version-name }}"
          if TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha' 2> /dev/null); then
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${TAG} already points to ${TAG_SHA}. Bump the version to release ${GITHUB_SHA}."
              exit 1
            fi
          fi

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > souji_release.jks

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f souji_release.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: souji-${{ steps.version.outputs.version-name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version-name }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version-name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
